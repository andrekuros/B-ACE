name: ci

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p bace-core -p bace-record -p bace-vec
      - run: cargo build -p bace-server

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install maturin pytest pettingzoo gymnasium numpy
      - run: maturin develop -m crates/bace-py/Cargo.toml
      - run: pytest -q tests/python
